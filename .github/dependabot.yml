# Keep the pinned action SHAs and the single Go dependency current. Actions
# are pinned to full commit SHAs in the workflows; Dependabot updates both
# the SHA and the trailing version comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
