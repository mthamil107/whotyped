name: e2e

# Runs the real binary against a real OpenSSH server, rsyslog and /proc in a
# container (lab/e2e) and fails on any unmet expectation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run both lab passes
        run: sh lab/e2e/run.sh
      - name: Keep the recordings when the lab fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-recordings
          path: lab/recordings/
          retention-days: 7
