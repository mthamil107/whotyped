name: e2e

# Runs the real binary against a real OpenSSH server, rsyslog and /proc in a
# container (lab/e2e) and fails on any unmet expectation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Run both lab passes
        run: sh lab/e2e/run.sh
      - name: Keep the recordings when the lab fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-recordings
          path: lab/recordings/
          retention-days: 7
