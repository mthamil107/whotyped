name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy is a no-op
        run: go mod tidy -diff
      - name: go test (race)
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: offline simulation
        shell: bash
        run: |
          go run ./cmd/whotyped simulate --offline --scenario claude-bash
          go run ./cmd/whotyped simulate --offline --scenario paramiko-mcp
          # Write to a file first: grep -q exits at the first match, and with
          # pipefail the replay would then die of a broken pipe.
          go run ./cmd/whotyped run --replay testdata/dataset/mcp-paramiko/events.jsonl --dry-run > "$RUNNER_TEMP/replay.jsonl"
          grep -q '"event":"agent_detected"' "$RUNNER_TEMP/replay.jsonl"

  cross:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: linux/amd64 and linux/arm64
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/whotyped
          GOOS=linux GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/whotyped
          GOOS=linux GOARCH=arm64 go vet ./...
