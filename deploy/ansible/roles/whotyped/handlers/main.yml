---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: reload sshd
  ansible.builtin.service:
    name: "{{ whotyped_sshd_service }}"
    state: reloaded

- name: load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: restart whotyped
  ansible.builtin.systemd:
    name: whotyped
    state: restarted
    daemon_reload: true
