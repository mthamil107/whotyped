# Quick sshd target for `whotyped simulate` and for pointing MCP SSH servers at.
#
#   mkdir -p lab/keys && ssh-keygen -t ed25519 -f lab/keys/alice -N '' && cp lab/keys/alice.pub lab/keys/alice.pub
#   docker compose -f lab/docker-compose.yml up -d --build
#   ssh -p 2222 -i lab/keys/alice -o ControlMaster=no alice@127.0.0.1 id
#   docker compose -f lab/docker-compose.yml logs -f --no-log-prefix sshd > lab/recordings/sshd-docker.log
#
# Limits: auditd cannot run inside the container, so only sshd lines are produced. whotyped
# itself should run on a real host; feed the captured log to `whotyped run --replay` via
# label.py, or tail it with the file reader for parser tests. Set SSHD_LOGLEVEL=DEBUG1 to
# get client banner lines.
services:
  sshd:
    build:
      context: .
      dockerfile: Dockerfile.sshd
    image: whotyped-lab-sshd:local
    container_name: whotyped-lab-sshd
    ports:
      - "127.0.0.1:2222:22"
    environment:
      SSHD_LOGLEVEL: "${SSHD_LOGLEVEL:-VERBOSE}"
    volumes:
      - ./keys:/keys:ro
    read_only: false
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "ss -ltn | grep -q ':22 '"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
